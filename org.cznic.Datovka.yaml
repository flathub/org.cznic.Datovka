app-id: org.cznic.Datovka
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: '6.10'
command: datovka
rename-desktop-file: datovka.desktop
rename-appdata-file: datovka.metainfo.xml
rename-icon: datovka

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.Notifications

cleanup:
  - "*.a"
  - "*.la"
  - "*.cmake"
  - "*.pc"
  - "/bin/xml*"
  - /include
  - /share/aclocal
  - "/share/doc/libxml*"
  - /share/gtk-doc
  - /share/man

modules:
  - name: libgcrypt-config
    buildsystem: simple
    build-commands:
        - install -Dm755 libgcrypt-config /app/bin/libgcrypt-config
    sources:
        - type: file
          path: libgcrypt-config

  - name: json-c
    buildsystem: cmake-ninja
    config-opts:
        - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
        - type: archive
          url: https://github.com/json-c/json-c/archive/refs/tags/json-c-0.18-20240915.tar.gz
          sha256: 3112c1f25d39eca661fe3fc663431e130cc6e2f900c081738317fba49d29e298

  - name: libdatovka
    config-opts:
        - --disable-doc
        - --disable-static
    sources:
        - type: archive
          url: https://secure.nic.cz/files/datove_schranky/libdatovka/libdatovka-0.7.3.tar.xz
          sha256: a6924d4cea81a87d6201036cafebe1283a8d372193a99e731970abf21e1434c1

  - name: quazip
    buildsystem: cmake-ninja
    sources:
        - type: archive
          url: https://github.com/stachenov/quazip/archive/refs/tags/v1.5.tar.gz
          sha256: 405b72b6e76c8987ff41a762523b8f64876ba406d8a831d268ee0b63f1369582

  - name: datovka
    buildsystem: qmake
    post-install:
        - mv /app/bin/datovka /app/bin/datovka-run
        - install -m755 datovka-script /app/bin/datovka
    sources:
        - type: archive
          url: https://secure.nic.cz/files/datove_schranky/4.29.0/datovka-4.29.0.tar.xz
          sha256: a708170670c106bdad64c37a938e4838463b0a1031c4e6ffd30ac6b61b7e9a73
        - type: patch
          path: datovka.patch
        - type: patch
          path: appdata.patch
        - type: patch
          path: paths.patch
        - type: script
          dest-filename: datovka-script
          commands: 
            - exec env TMPDIR=$XDG_CACHE_HOME /app/bin/datovka-run "$@"
