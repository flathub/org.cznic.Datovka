app-id: org.cznic.Datovka
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: '6.11'
command: datovka
rename-desktop-file: cz.nic.datovka.desktop
rename-appdata-file: cz.nic.datovka.metainfo.xml
rename-icon: datovka

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.Notifications

cleanup:
  - "*.a"
  - "*.la"
  - "*.cmake"
  - "*.pc"
  - "/bin/xml*"
  - /include
  - /share/aclocal
  - "/share/doc/libxml*"
  - /share/gtk-doc
  - /share/man

modules:
  - name: libgcrypt-config
    buildsystem: simple
    build-commands:
        - install -Dm755 libgcrypt-config /app/bin/libgcrypt-config
    sources:
        - type: file
          path: libgcrypt-config

  - name: json-c
    buildsystem: cmake-ninja
    config-opts:
        - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
        - type: archive
          url: https://github.com/json-c/json-c/archive/refs/tags/json-c-0.19-20260627.tar.gz
          sha256: f17a6d7d265cf840dfd8f0f46a606d98c6b5b26dc7cfe27275d1546a213086c8

  - name: libdatovka
    config-opts:
        - --disable-doc
        - --disable-static
    sources:
        - type: archive
          url: https://secure.nic.cz/files/datove_schranky/libdatovka/libdatovka-0.8.0.tar.xz
          sha256: 13071db8bd4025d03716d83ae462c2b90eb78f6a4fdd27f5c1e1758eb7399cb7

  - name: quazip
    buildsystem: cmake-ninja
    sources:
        - type: archive
          url: https://github.com/stachenov/quazip/archive/refs/tags/v1.7.2.tar.gz
          sha256: 5240f4a3475648773ba10af8b0ebe549cbfc5d6de00470a517330a80068a4f78

  - name: datovka
    buildsystem: qmake
    post-install:
        - mv /app/bin/datovka /app/bin/datovka-run
        - install -m755 datovka-script /app/bin/datovka
    sources:
        - type: archive
          url: https://secure.nic.cz/files/datove_schranky/4.30.2/datovka-4.30.2.tar.xz
          sha256: d871204b7f547d609c3b7c99d827bb3dea10bb917ade67ee93df7b85150f57df
        - type: patch
          path: datovka.patch
        - type: patch
          path: appdata.patch
        - type: patch
          path: paths.patch
        - type: script
          dest-filename: datovka-script
          commands: 
            - exec env TMPDIR=$XDG_CACHE_HOME /app/bin/datovka-run "$@"
